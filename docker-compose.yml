services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
      RAG_STORAGE_DIR: /app/storage
      # 生产必须用环境变量覆盖这两个密钥（见 README）
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:-dev-jwt-secret-change-me-please-32}
      RAG_ENCRYPTION_KEY: ${RAG_ENCRYPTION_KEY:-dev-encryption-key-change-me-32bytes}
    volumes:
      - ./storage:/app/storage
    ports:
      - "9000:8080"
    # 容器内经 host.docker.internal 访问宿主机的 oMLX（如 http://host.docker.internal:8000/v1）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
